# Git hooks (installed via the root `prepare` script → `lefthook install`).
# Docs: https://lefthook.dev/configuration/
#
# No hooks are configured today. When adding one, note that `glob` takes a
# **list**, not a brace expansion: `{a,b}` is passed through to the matcher
# verbatim and matches nothing, silently — a job wired that way logs
# "(skip) no matching staged files" on every commit and no reviewer reads a
# skip line.
