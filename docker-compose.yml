services:
    postgres:
        image: postgres:16-alpine
        container_name: ortha-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ortha
            POSTGRES_PASSWORD: ortha
            POSTGRES_DB: ortha_cms
        ports:
            - '5432:5432'
        volumes:
            - ortha-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ortha -d ortha_cms']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    ortha-pgdata:
